window.onerror = (message, source, lineno, colno, errorObj) => {

		<script type="module">
const observer = new MutationObserver((mutations) => {
	for (const mutation of mutations) {
		for (const addedNode of mutation.addedNodes) {
			if (
				addedNode.nodeType === Node.ELEMENT_NODE &&
				(
					addedNode.tagName?.toLowerCase() === 'vite-error-overlay' ||
					addedNode.classList?.contains('backdrop')
				)
			) {
				handleViteOverlay(addedNode);
			}
		}
	}
});

observer.observe(document.documentElement, {
	childList: true,
	subtree: true
});

function handleViteOverlay(node) {
	if (!node.shadowRoot) {
		return;
	}

	const backdrop = node.shadowRoot.querySelector('.backdrop');

	if (backdrop) {
		const overlayHtml = backdrop.outerHTML;
		const parser = new DOMParser();
		const doc = parser.parseFromString(overlayHtml, 'text/html');
		const messageBodyElement = doc.querySelector('.message-body');
		const fileElement = doc.querySelector('.file');
		const messageText = messageBodyElement ? messageBodyElement.textContent.trim() : '';
		const fileText = fileElement ? fileElement.textContent.trim() : '';
		const error = messageText + (fileText ? ' File:' + fileText : '');

		window.parent.postMessage({
			type: 'horizons-vite-error',
			error,
		}, '*');
	}
}
</script>
		<script type="module">
const originalConsoleError = console.error;
console.error = function(...args) {
	originalConsoleError.apply(console, args);

	let errorString = '';

	for (let i = 0; i < args.length; i++) {
		const arg = args[i];
		if (arg instanceof Error) {
			errorString = arg.stack || `${arg.name}: ${arg.message}`;
			break;
		}
	}

	if (!errorString) {
		errorString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
	}

	window.parent.postMessage({
		type: 'horizons-console-error',
		error: errorString
	}, '*');
};
</script>
		<script type="module">
const originalFetch = window.fetch;

window.fetch = function(...args) {
	const url = args[0] instanceof Request ? args[0].url : args[0];

	// Skip WebSocket URLs
	if (url.startsWith('ws:') || url.startsWith('wss:')) {
		return originalFetch.apply(this, args);
	}

	return originalFetch.apply(this, args)
		.then(async response => {
			const contentType = response.headers.get('Content-Type') || '';

			// Exclude HTML document responses
			const isDocumentResponse =
				contentType.includes('text/html') ||
				contentType.includes('application/xhtml+xml');

			if (!response.ok && !isDocumentResponse) {
					const responseClone = response.clone();
					const errorFromRes = await responseClone.text();
					const requestUrl = response.url;
					console.error(`Fetch error from ${requestUrl}: ${errorFromRes}`);
			}

			return response;
		})
		.catch(error => {
			if (!url.match(/.html?$/i)) {
				console.error(error);
			}

			throw error;
		});
};
</script>

		<script>
		(function() {
			// Admin sayfalarında korumayı devre dışı bırak
			function isAdminPage() {
				return window.location.pathname.startsWith('/admin');
			}

			// Sağ tık engelle
			document.addEventListener('contextmenu', function(e) {
				if (!isAdminPage()) {
					e.preventDefault();
					return false;
				}
			});

			// Ctrl+C, Ctrl+U, Ctrl+S, Ctrl+A, Ctrl+X, F12 engelle
			document.addEventListener('keydown', function(e) {
				if (isAdminPage()) return;
				// Input/textarea içindeyse izin ver
				var tag = (e.target.tagName || '').toLowerCase();
				if (tag === 'input' || tag === 'textarea') return;

				if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'a' || e.key === 'A' || e.key === 'x' || e.key === 'X')) {
					e.preventDefault();
					return false;
				}
				if (e.key === 'F12') {
					e.preventDefault();
					return false;
				}
			});

			// Sürükle-bırak engelle (resimler için)
			document.addEventListener('dragstart', function(e) {
				if (!isAdminPage()) {
					e.preventDefault();
					return false;
				}
			});

			// Kopyalama olayını engelle
			document.addEventListener('copy', function(e) {
				if (!isAdminPage()) {
					var tag = (e.target.tagName || '').toLowerCase();
					if (tag !== 'input' && tag !== 'textarea') {
						e.preventDefault();
						return false;
					}
				}
			});

			// Kesme olayını engelle
			document.addEventListener('cut', function(e) {
				if (!isAdminPage()) {
					var tag = (e.target.tagName || '').toLowerCase();
					if (tag !== 'input' && tag !== 'textarea') {
						e.preventDefault();
						return false;
					}
				}
			});
		})();
		</script>
